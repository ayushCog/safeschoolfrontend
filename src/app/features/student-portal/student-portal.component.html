<app-navbar
  applicationTitle="Safe School"
  [userName]="(currentUser$ | async)?.name || 'Student'"
  [notificationCount]="(notificationCount$ | async) || 0"
  [notificationItems]="(studentNotifications$ | async) || []"
  (logoutClicked)="logout()"
  (notificationRead)="onNotificationRead($event)"
></app-navbar>

<div class="space-y-6 p-6">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Student Dashboard</h1>
    <p class="mt-2 text-sm text-gray-600">
      Welcome to your student safety dashboard. Access support and report incidents.
    </p>
  </div>

  <div class="border-b border-gray-200">
    <div class="flex space-x-8">
      <a
        routerLink="report-incident"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        Report Incident
      </a>
      <a
        routerLink="my-reports"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        My Reports
      </a>
    </div>
  </div>

  <div class="mt-6">
    <router-outlet></router-outlet>
  </div>
</div>
