<app-navbar
  applicationTitle="Safe School"
  [userName]="(currentUser$ | async)?.name || 'Staff Member'"
  (logoutClicked)="logout()"
></app-navbar>

<div class="space-y-6 p-6">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Officer Portal</h1>
    <p class="mt-2 text-sm text-gray-600">
      Unified dashboard for incident management, training, and compliance tracking.
    </p>
  </div>

  <div class="border-b border-gray-200">
    <div class="flex flex-wrap space-x-2 sm:space-x-8">
      <a
        routerLink="console"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        Dashboard
      </a>
      <a
        routerLink="log-incident"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        Log Incident
      </a>
      <a
        routerLink="manage-incidents"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        Manage Incidents
      </a>
      <a
        routerLink="trainings"
        routerLinkActive="border-b-2 border-blue-500 text-blue-600"
        class="px-4 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >
        Trainings
      </a>
    </div>
  </div>

  <div class="mt-6">
    <router-outlet></router-outlet>
  </div>
</div>
