<div class="min-h-screen py-10 flex items-center justify-center bg-black bg-cover bg-center bg-fixed">

    <div class="backdrop-blur-xl bg-white/15 rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/30 border-t-white/50 ring-1 ring-black/5">
        
        <h1 class="text-3xl font-bold text-center text-white drop-shadow-lg mb-2">Safe School</h1>
        <h2 class="text-sm text-center text-white/70 tracking-wide mb-8 uppercase font-medium">School Safety Management System</h2>

        <form (ngSubmit)="onLogin()" class="space-y-4">
            <div class="form-group">
                <label for="email" class="block text-xs font-semibold text-white/80 uppercase mb-1 ml-1">Email Address</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-2 bg-white/10 border border-white/20 rounded-lg focus:ring-2 focus:ring-white/40 focus:outline-none placeholder:text-white/40 text-white transition-all"
                    aria-label="Email address"
                />
            </div>

            <div class="form-group">
                <label for="password" class="block text-xs font-semibold text-white/80 uppercase mb-1 ml-1">Password</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    [(ngModel)]="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-2 bg-white/10 border border-white/20 rounded-lg focus:ring-2 focus:ring-white/40 focus:outline-none placeholder:text-white/40 text-white transition-all"
                    aria-label="Password"
                />
            </div>

            @if (errorMessage$ | async; as error) {
            <div class="bg-red-500/20 border border-red-500/50 text-red-100 px-4 py-3 rounded-lg text-sm backdrop-blur-md" role="alert">
                ⚠️ {{ error }}
            </div>
            }

            <div class="pt-2">
                <app-button
                label="Sign In"
                variant="primary"
                [isDisabled]="(isLoading$ | async) || false"
                buttonType="submit"
                class="w-full shadow-lg"
                />
            </div>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-white/60">
                Don't have an account?
                <button
                    type="button"
                    (click)="goToSignup()"
                    class="text-white hover:text-blue-300 font-bold underline decoration-white/30 underline-offset-4 ml-1 transition-colors"
                >
                    Sign Up
                </button>
            </p>
        </div>
    </div>
</div>
